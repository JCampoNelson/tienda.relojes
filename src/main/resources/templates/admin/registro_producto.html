<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar reloj | Tienda de relojes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 p-4 text-slate-800 sm:p-8">

    <main class="mx-auto max-w-5xl">
        <header class="rounded-lg bg-[#102a43] px-6 py-7 shadow-sm sm:px-8">
            <p class="text-sm font-medium tracking-wide text-[#e8c98e]">Tienda de relojes</p>
            <h1 class="mt-2 font-serif text-3xl text-white sm:text-4xl">Registrar reloj</h1>
            <p class="mt-2 max-w-xl text-sm leading-6 text-slate-300">Introduce los datos del nuevo producto para publicarlo en el catálogo.</p>
        </header>

        <section class="mt-6 rounded-lg border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
            <div th:insert="~{fragments/general.html :: menu}"></div>

            <div class="mt-6 rounded-lg border border-slate-200 bg-slate-50 p-5">
                <h2 class="font-serif text-2xl text-slate-800">Nuevo producto</h2>
                <p class="mt-2 text-sm text-slate-600">Completa el formulario con la información del reloj.</p>

                <form action="#" th:action="@{/admin/guardarReloj}" th:object="${nuevo}" method="post" enctype="multipart/form-data" class="mt-6 grid gap-5 md:grid-cols-2">
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700">Marca</label>
                        <input type="text" th:field="*{marca}" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-[#d8aa62] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]/30">
                        <span class="block text-sm font-medium text-red-600" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></span>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700">Modelo</label>
                        <input type="text" th:field="*{modelo}" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-[#d8aa62] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]/30">
                        <span class="block text-sm font-medium text-red-600" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}"></span>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700">Precio</label>
                        <input type="number" th:field="*{precio}" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-[#d8aa62] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]/30">
                        <span class="block text-sm font-medium text-red-600" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700">Stock</label>
                        <input type="number" th:field="*{stock}" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-[#d8aa62] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]/30">
                        <span class="block text-sm font-medium text-red-600" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700">Tipo de movimiento</label>
                        <input type="text" th:field="*{tipoMovimiento}" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-[#d8aa62] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]/30">
                        <span class="block text-sm font-medium text-red-600" th:if="${#fields.hasErrors('tipoMovimiento')}" th:errors="*{tipoMovimiento}"></span>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-slate-700">Resistencia al agua</label>
                        <input type="number" th:field="*{resistenciaAgua}" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-[#d8aa62] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]/30">
                        <span class="block text-sm font-medium text-red-600" th:if="${#fields.hasErrors('resistenciaAgua')}" th:errors="*{resistenciaAgua}"></span>
                    </div>

                    <div class="space-y-2 md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700">Género</label>
                        <input type="text" th:field="*{genero}" class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-[#d8aa62] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]/30">
                        <span class="block text-sm font-medium text-red-600" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></span>
                    </div>

                    <div class="space-y-2 md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700">Portada</label>
                        <input type="file" th:field="*{fotoSubida}" class="block w-full rounded-md border border-dashed border-slate-300 bg-white px-3 py-2 text-sm text-slate-600 shadow-sm file:mr-3 file:rounded-md file:border-0 file:bg-[#102a43] file:px-3 file:py-2 file:text-sm file:font-medium file:text-white hover:file:bg-[#1d3d5d] focus:border-[#d8aa62] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]/30">
                    </div>

                    <div class="md:col-span-2 flex justify-end pt-2">
                        <input type="submit" value="Guardar" class="inline-flex cursor-pointer items-center rounded-md border border-[#d8aa62] bg-[#102a43] px-4 py-2 text-sm font-medium text-[#e8c98e] transition-colors hover:bg-[#1d3d5d] focus:outline-none focus:ring-2 focus:ring-[#d8aa62] focus:ring-offset-2">
                    </div>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
