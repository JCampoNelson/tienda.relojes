<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto recibido | Tienda de relojes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 p-4 text-slate-800 sm:p-8">

    <main class="mx-auto max-w-5xl">
        <header class="rounded-lg bg-[#102a43] px-6 py-7 shadow-sm sm:px-8">
            <p class="text-sm font-medium tracking-wide text-[#e8c98e]">Tienda de relojes</p>
            <h1 class="mt-2 font-serif text-3xl text-white sm:text-4xl">Registro de producto</h1>
            <p class="mt-2 max-w-xl text-sm leading-6 text-slate-300">Confirmación de recepción del nuevo reloj.</p>
        </header>

        <section class="mt-6 rounded-lg border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
            <div th:insert="~{fragments/general.html :: menu}"></div>

            <div class="mt-6 flex min-h-36 flex-col items-center justify-center rounded-lg border border-slate-200 bg-slate-50 p-5 text-center sm:p-6">
                <p class="text-xs font-semibold uppercase tracking-[0.18em] text-[#102a43]">Solicitud recibida</p>
                <h2 class="mt-2 font-serif text-xl text-slate-800 sm:text-2xl">Producto recibido correctamente</h2>
            </div>
        </section>
    </main>

</body>
</html>
