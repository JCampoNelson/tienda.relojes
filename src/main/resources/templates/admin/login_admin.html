<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a administración | Tienda de relojes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 p-4 text-slate-800 sm:p-8">

    <main class="mx-auto max-w-5xl">
        <header class="rounded-lg bg-[#102a43] px-6 py-7 shadow-sm sm:px-8">
            <p class="text-sm font-medium tracking-wide text-[#e8c98e]">Tienda de relojes</p>
            <h1 class="mt-2 font-serif text-3xl text-white sm:text-4xl">Acceso a administración</h1>
            <p class="mt-2 max-w-xl text-sm leading-6 text-slate-300">Identifícate para gestionar la tienda.</p>
        </header>

        <section class="mt-6 rounded-lg border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
            <div class="mx-auto max-w-lg rounded-lg border border-slate-200 bg-slate-50 p-5 sm:p-6">
                <h2 class="font-serif text-2xl text-slate-800">Verificación de acceso</h2>
                <p class="mt-2 text-sm leading-6 text-slate-600">No puedes acceder a administración hasta que te identifiques.</p>

                <form action="admin/gestionarRelojes" class="mt-6 space-y-5">
                    <div class="space-y-2">
                        <label for="pass-login-admin" class="block text-sm font-medium text-slate-700">Contraseña</label>
                        <input id="pass-login-admin" type="password" name="pass-login-admin" required class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-800 shadow-sm focus:border-[#d8aa62] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]/30">
                    </div>

                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <a href="/" class="text-sm font-medium text-slate-600 transition-colors hover:text-[#102a43] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]">Volver a la tienda</a>
                        <button type="submit" class="inline-flex cursor-pointer items-center rounded-md border border-[#d8aa62] bg-[#102a43] px-4 py-2 text-sm font-medium text-[#e8c98e] transition-colors hover:bg-[#1d3d5d] focus:outline-none focus:ring-2 focus:ring-[#d8aa62] focus:ring-offset-2">Aceptar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
