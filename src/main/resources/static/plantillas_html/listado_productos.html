{{#.}}
<!-- Esta es la nomenclatura de mustache.js
con esto indicamos que el html que haya
aqui se pueda usar para aplicarlo sobre
cada elemento de un array -->

<article class="mb-4 overflow-hidden rounded-md border border-slate-200 border-t-2 border-t-[#d8aa62] bg-white shadow-sm">
    <div class="grid gap-5 p-4 sm:grid-cols-[180px_1fr] sm:px-5">

        <!-- Imagen de portada -->
        <div class="flex items-center justify-center rounded-md border border-slate-200 bg-slate-50 p-3">
            <img src="mostrar_imagen?id={{id}}" alt="{{modelo}}" class="h-40 w-full object-contain">
        </div>

        <!-- Datos del reloj -->
        <div class="flex flex-col">
            <div class="flex flex-wrap items-start justify-between gap-3 border-b border-slate-100 pb-3">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wide text-[#d8aa62]">{{marca}}</p>
                    <h2 class="mt-1 font-serif text-2xl text-[#102a43]">{{modelo}}</h2>
                </div>
                <p class="text-2xl font-semibold text-[#102a43]">{{precio}} €</p>
            </div>

            <dl class="mt-3 grid grid-cols-2 gap-x-6 gap-y-3 sm:grid-cols-3">
                <div>
                    <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Movimiento</dt>
                    <dd class="mt-1 text-sm font-medium text-slate-800">{{tipoMovimiento}}</dd>
                </div>
                <div>
                    <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Resistencia al agua</dt>
                    <dd class="mt-1 text-sm font-medium text-slate-800">{{resistenciaAgua}} m</dd>
                </div>
                <div>
                    <dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Género</dt>
                    <dd class="mt-1 text-sm font-medium text-slate-800">{{genero}}</dd>
                </div>
            </dl>
        </div>
    </div>

    <!-- Acciones -->
    <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 bg-slate-50 px-4 py-3 sm:px-5">
        <a href="#" onclick="mostrar_detalles({{id}})"
           class="rounded-md border border-[#d8aa62] px-3 py-2 text-sm font-medium text-[#102a43] transition-colors hover:bg-[#102a43] hover:text-[#e8c98e] focus:outline-none focus:ring-2 focus:ring-[#d8aa62] focus:ring-offset-2">
            Ver detalles
        </a>

        <div class="flex items-center gap-3">
            <label for="cantidad_{{id}}" class="text-xs font-semibold uppercase tracking-wide text-slate-500">Cantidad</label>
            <input type="number" id="cantidad_{{id}}" value="1" min="1" max="{{stock}}"
                   class="w-16 rounded-md border border-slate-300 bg-white px-2 py-2 text-center text-sm text-slate-800 shadow-sm focus:border-[#d8aa62] focus:outline-none focus:ring-2 focus:ring-[#d8aa62]/30">
            <a href="#" onclick="alert('Agregar ' + $('#cantidad_{{id}}').val() + ' unidad(es) al carrito'); return false;"
               class="inline-flex items-center rounded-md border border-[#d8aa62] bg-[#102a43] px-4 py-2 text-sm font-medium text-[#e8c98e] transition-colors hover:bg-[#1d3d5d] focus:outline-none focus:ring-2 focus:ring-[#d8aa62] focus:ring-offset-2">
                Agregar al carrito
            </a>
        </div>
    </div>
</article>

{{/.}}
